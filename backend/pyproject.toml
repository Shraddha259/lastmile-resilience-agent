[project]
name = "lastmile-backend"
version = "0.1.0"
description = "LastMile backend: from disaster alert to confirmed safety"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.143.0",
    "google-cloud-firestore>=2.34.1",
    "google-genai>=2.30.1",
    "pydantic-settings>=2.15.0",
    "shapely>=2.2.0",
    "slowapi>=0.1.10",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["live: calls a real Gemini model (needs GEMINI_API_KEY)"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]
